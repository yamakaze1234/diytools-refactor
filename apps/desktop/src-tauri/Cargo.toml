[package]
name = "desktop"
version = "0.2.11"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
default-run = "desktop"

[features]
custom-protocol = ["tauri/custom-protocol"]
review-host = []

[[bin]]
name = "workbench-review-host"
path = "src/bin/workbench-review-host.rs"
required-features = ["review-host"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["process", "time", "io-util", "sync"] }
rusqlite = { version = "0.40", features = ["bundled", "backup", "serialize"] }
base64 = "0.23.1"
chrono = "0.4.45"
rfd = "0.15.4"
ed25519-dalek = "2.2"
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
uuid = { version = "1", features = ["v4"] }
flate2 = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_Security_Credentials"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
