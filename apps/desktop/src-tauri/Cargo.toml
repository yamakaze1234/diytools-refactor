[package]
name = "desktop"
version = "0.2.52"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
default-run = "desktop"

[features]
custom-protocol = ["tauri/custom-protocol"]
review-host = []
agent-tools = ["dep:diytools-agent-core"]
# 独立正式包从程序旁配置直接启动，禁止无配置时退回本机工作区。
formal-nas-client = []
# 使用独立目录、合成账号和真实 API 的本机验收包。
nas-acceptance = ["formal-nas-client"]

[[bin]]
name = "agent-review-host"
path = "src/bin/agent-review-host.rs"
required-features = ["review-host", "agent-tools"]

[[bin]]
name = "cloud-review-host"
path = "src/bin/cloud-review-host.rs"
required-features = ["review-host"]

[[bin]]
name = "workbench-review-host"
path = "src/bin/workbench-review-host.rs"
required-features = ["review-host"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
diytools-agent-core = { path = "../../../packages/agent-core", optional = true }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["process", "time", "io-util", "sync"] }
rusqlite = { version = "0.40", features = ["bundled", "backup", "serialize", "hooks"] }
base64 = "0.23.1"
chrono = "0.4.45"
rfd = "0.15.4"
ed25519-dalek = "2.2"
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
uuid = { version = "1", features = ["v4"] }
flate2 = "1"

[target.'cfg(windows)'.dependencies]
# 便携程序从资源管理器打开时不一定继承代理环境变量；公共 HTTPS 仍遵循 Windows 当前用户代理设置。
reqwest = { version = "0.12", default-features = false, features = ["system-proxy"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_Security_Credentials"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
